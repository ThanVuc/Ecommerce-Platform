name: Deploy Ecommerce App

on:
  push:
    branches:
      - main  # Trigger on changes to the 'main' branch

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create appsettings.json
        run: |
          echo "${{ secrets.APPSETTINGS_PROD }}" > encoded_file.txt
          base64 -d -i encoded_file.txt > ./EPlatform_API/EPlatform_API/appsettings.json
          rm encoded_file.txt

      # Step 2: Set up Docker Buildx (optional, for multi-platform builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build the Docker images from the docker-compose.yml file
      - name: Build Docker images
        run: |
          docker compose -f docker-compose.yml build --no-cache

      # Step 5: Push Docker images to Docker Hub
      - name: Push Docker images
        run: |
          docker compose push  # This will push all images defined in the docker-compose.yml to Docker Hub

  deploy:
    runs-on: ubuntu-latest

    needs: build_and_push  # Make sure this runs after the build job

    steps:
      # Step 1: Checkout code (not strictly necessary for the deploy step)
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts

      # Step 2: Upload nginx folder and docker-compose.yml to VPS
      - name: Copy docker-compose.yml ansd Nginx folder to VPS
        run: |
          scp -i ~/.ssh/id_rsa docker-compose.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:/home/${{ secrets.VPS_USER }}/
          scp -i ~/.ssh/id_rsa -r ./nginx ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:/home/${{ secrets.VPS_USER }}/

      # Step 3: SSH to VPS and deploy
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            # Go to the directory where your app's Docker Compose file is located
            cd /home/debian/

            # Pull the latest images from Docker Hub (useful if you pushed the new images)
            docker compose pull

            # List the images to verify the latest ones are pulled
            docker images

            # Shut down the existing containers
            docker compose down

            # Start the containers with the updated images
            docker compose up -d
