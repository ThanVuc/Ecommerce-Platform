server {
    listen 80;

    server_name www.eplatform.online;
    return 301 http://eplatform.online$request_uri;
}

server {
    listen 80;
    server_name trans.eplatform.online;
    # Proxy to UI
    location / {
        proxy_pass http://eplatform_ui:80;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}