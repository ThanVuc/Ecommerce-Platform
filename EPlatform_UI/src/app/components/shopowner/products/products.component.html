
<div class="header">
    <p class="title">All Products</p>
    <div class="search-bar">
        <span class="iconamoon--search-light"></span>
        <input id="search-input" type="text" (keydown.enter)="loadProducts()" [(ngModel)]="searchString" name="searchString" placeholder="Search Here!">
    </div>
<div class="body">
    <table class="table table-striped table-dark">
        <thead>
            <tr>
                <th scope="col">Id</th>
                <th scope="col">Product</th>
                <th scope="col">Public</th>
                <th scope="col">Price</th>
                <th scope="col">Inventory</th>
                <th scope="col">Manipulation</th>
            </tr>
        </thead>
        <tbody>
            @for (product of products; track $index) {
            <tr>
                <th scope="row">{{ product.productId }}</th>
                <td>
                    <div class="product-show">
                        <img src="{{ product.avtImgUrl }}" alt="">
                        <p>{{ product.name }}</p>
                    </div>
                </td>
                <td>
                    @if (product.isPublic){
                    <input (click)="switchStatus(product.productId,product.isPublic)" type="checkbox" checked name="" id="">
                    } @else {
                    <input (click)="switchStatus(product.productId,product.isPublic)" type="checkbox" name="" id="">
                    }
                </td>
                <td>{{ product.price }}</td>
                <td class="inventory-field">{{ product.inventory.availableQuantity }}</td>
                <td>
                    <button class="action">
                        <span class="icon-park-outline--view-grid-detail"></span>
                    </button>
                    <button class="action delete">
                        <span class="weui--delete-outlined"></span>
                    </button>
                    <a href="/shop-owner/{{shopId}}/products/{{product.productId}}/update" class="action edit">
                        <span class="flowbite--edit-outline"></span>
                    </a>
                </td>
            </tr>
            }
        </tbody>
    </table>
</div>

<div class="pagination">
    <app-pagination [pageIndex]="pageIndex" [limit]="limit" [totalItem]="totalItem"
        (page)="loadPage($event)"></app-pagination>
</div>
