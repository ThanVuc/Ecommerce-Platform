<div class="container">
    <h3 class="title" >User Management</h3>
    <div class="tool">
        <div class="search-bar" >
            <span class="iconamoon--search-light"></span>
            <input type="text" placeholder="Search Here!" >
        </div>
        <button class="create-btn">Create User</button>
    </div>
    <div class="table-box">
        <table class="table table-dark table-striped" >
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Created</th>
                    <th>Role</th>
                    <th>Active</th>
                </tr>
            </thead>
            <tbody>
                @for (user of users; track $index) {
                    <tr>
                        <td>{{user.username}}</td>
                        <td>{{user.created | date:'mediumDate'}}</td>
                        <td>
                            @for (role of user.roles; track $index) {
                                <span>{{role}}</span>
                            }
                        </td>
                        <td class="active" (click)="changeStatus(user.id)" >
                            @if (user.active) {
                                <span>ON</span>
                                <div class="status on"></div>
                            } @else {
                                <div class="status off"></div>
                                <span>OFF</span>
                            }

                        </td>
                    </tr>
                }
            </tbody>
        </table>
        <div class="mt-2">
            <app-pagination [pageIndex]="pageIndex" [limit]="limit" [totalItem]="totalItem" (page)="loadPage($event)" ></app-pagination>
        </div>
    </div>
