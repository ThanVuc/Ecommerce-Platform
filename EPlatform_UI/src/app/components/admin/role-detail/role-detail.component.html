<div class="container">
    <div class="header">
        <h5 class="title" >Role Name: {{role.roleName}}</h5>
        <app-add-new-claim (create)="addRoleClaim($event)" ></app-add-new-claim>
    </div>
    @if (isLoading){
        <div class="loading-effect">
            <div class="spinner-border" role="status">
                <span class="sr-only"></span>
            </div>
        </div>
    } @else {
        <div class="table-box">
            <table class="table table-dark table-striped" >
                <thead>
                    <tr>
                        <th>Claim Type</th>
                        <th>Claim Value</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    @for (claim of role.claims; track $index) {
                        <tr>
                            <td>{{claim.claimType}}</td>
                            <td>{{claim.claimValue}}</td>
                            <td>
                                <button class="action edit" (click)="showUpdateClaimForm(claim.claimId, claim.claimType, claim.claimValue)" >
                                    <span class="flowbite--edit-outline"></span>
                                </button>
                                <button class="action delete" (click)="deleteRoleClaim(claim.claimId)" >
                                    <span class="weui--delete-outlined"></span>
                                </button>
                            </td>
                        </tr>
                    }
                        
                </tbody>
            </table>
        </div>
    }
    

</div>

<app-message></app-message>
<app-update-role-claim (update)="updateRoleClaim($event)" ></app-update-role-claim>
