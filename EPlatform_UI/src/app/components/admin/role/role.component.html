<div class="container">
    <h3 class="title" >Role Management</h3>
    <app-create-role (create)="createRole($event)" ></app-create-role>
    @if (isLoading){
        <div class="spinner-border" role="status">
            <span class="sr-only"></span>
        </div>
    }
    @else {
        <div class="table-box">
            <table class="table table-dark table-striped" >
                <thead>
                    <tr>
                        <th>Role Name</th>
                        <th>Claims</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    @for (role of roles; track $index) {
                        <tr>
                            <td>{{role.roleName}}</td>
                            <td>
                                @for (item of role.claims.slice(0,3); track $index) {
                                    <p>{{item.claimType}} : {{item.claimValue}}</p>
                                }
                            </td>
                            <td>
                                <button class="action edit" (click)="showUpdateRole(role.roleId, role.roleName)" >
                                    <span class="flowbite--edit-outline"></span>
                                </button>
                                <button class="action delete" (click)="deleteRole(role.roleId)" >
                                    <span class="weui--delete-outlined"></span>
                                </button>
                                <button class="action" routerLink="/admin/roles/{{role.roleId}}" >
                                    <span class="icon-park-outline--view-grid-detail"></span>
                                </button>
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
        <div class="mt-2">
            <app-pagination [pageIndex]="pageIndex" [limit]="limit" [totalItem]="totalItem" (page)="loadPage($event)" ></app-pagination>
        </div>
    }
</div>

<app-message style="z-index: 9999;"></app-message>
<app-update-role (update)="updateRole($event)" ></app-update-role>
