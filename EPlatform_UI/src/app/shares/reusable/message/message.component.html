<div id="message-box" class="message-box success">
    <div class="message" id="message">
        <span id="message-icon"></span>
        <p id="message-text" class="message-text"></p>
    </div>
    <div id="close-message" (click)="closeModal()" class="close">
        <span class="material-symbols--close"></span>
    </div>
</div>
